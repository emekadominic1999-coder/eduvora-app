# NOTE: the icons are generated by `py tools/gen_icons.py` (crisp mark, correct
# safe-zone padding). If you ever re-run flutter_launcher_icons instead, these
# masters keep it consistent with that script rather than the tiny 249px mark.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/eduvora_icon_master_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/branding/eduvora_icon_foreground_1024.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/eduvora_icon_master_1024.png"
    background_color: "#F8FAFC"
    theme_color: "#2563EB"
