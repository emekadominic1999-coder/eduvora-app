<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eduvora - the learning companion for Nigerian university students.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eduvora">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eduvora</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Mobile browsers can silently discard the renderer's WebGL context
    // while this tab sits backgrounded, to reclaim GPU memory, and Flutter
    // never repaints after that -- the student is left looking at a plain
    // black rectangle where the app was until they force-close and reopen
    // it themselves. Recover automatically instead, on whichever signal the
    // browser actually gives:
    //   - webglcontextlost fires when it is detected directly.
    //   - pageshow with event.persisted fires when the browser restores the
    //     page from its back-forward cache (a frozen snapshot) instead of
    //     truly reloading it -- the likely cause here, since it skips
    //     Flutter's normal startup entirely and is common on mobile Safari.
    //   - visibilitychange is a last-resort catch-all for anything that
    //     slips past the first two, with a short hidden threshold since
    //     mobile OSes reclaim a backgrounded tab's resources quickly.
    (function () {
      var reloaded = false;
      function reloadOnce() {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      }
      document.addEventListener('webglcontextlost', reloadOnce, true);
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) reloadOnce();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          window.__eduvoraHiddenAt = Date.now();
        } else if (window.__eduvoraHiddenAt) {
          var hiddenMs = Date.now() - window.__eduvoraHiddenAt;
          if (hiddenMs > 20 * 1000) reloadOnce();
        }
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
