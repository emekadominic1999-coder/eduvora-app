<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Eduvora - the learning companion for Nigerian university students.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Eduvora">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eduvora</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown the instant the HTML parses, well before main.dart.js has even
       downloaded -- otherwise the OS's own install splash (built from the
       manifest icon) drops straight to a blank page while Flutter loads.
       Matches Flutter's own splash screen (brand gradient, white mark,
       wordmark, spinner) so the handoff between the two is an invisible
       crossfade rather than a jarring colour swap. Removed the moment
       Flutter dispatches its first real frame. */
    #eduvora-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E3A8A, #2563EB, #3B82F6);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    #eduvora-splash.eduvora-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #eduvora-splash img {
      width: 88px;
      height: 88px;
      /* the bundled mark is drawn in brand blue; brightness(0) flattens it
         to solid black (keeping its alpha shape), then invert(1) flips
         that to white -- cheaper and crisper than shipping a second file */
      filter: brightness(0) invert(1);
      animation: eduvora-breathe 1.7s ease-in-out infinite;
    }
    #eduvora-splash h1 {
      margin: 22px 0 4px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }
    #eduvora-splash p {
      margin: 0 0 40px;
      font-size: 14.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
    }
    #eduvora-splash .eduvora-ring {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.4px solid rgba(255, 255, 255, 0.3);
      border-top-color: rgba(255, 255, 255, 0.9);
      animation: eduvora-spin 0.9s linear infinite;
    }
    @keyframes eduvora-breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.85; }
    }
    @keyframes eduvora-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="eduvora-splash">
    <img src="icons/Icon-192.png" alt="Eduvora" />
    <h1>Eduvora</h1>
    <p>Learn together. Graduate stronger.</p>
    <div class="eduvora-ring"></div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('eduvora-splash');
      var hidden = false;
      function hideSplash() {
        if (hidden || !splash) return;
        hidden = true;
        splash.classList.add('eduvora-splash-hidden');
        setTimeout(function () { splash.remove(); }, 500);
      }
      // Flutter web dispatches this on window once the first real frame has
      // painted -- the precise moment the app is actually ready to show.
      window.addEventListener('flutter-first-frame', hideSplash);
      // Safety net: never leave a student staring at a stuck splash if that
      // event is somehow missed.
      setTimeout(hideSplash, 8000);
    })();
  </script>

  <script>
    // Mobile browsers can silently discard the renderer's WebGL context
    // while this tab sits backgrounded, to reclaim GPU memory, and Flutter
    // never repaints after that -- the student is left looking at a plain
    // black rectangle where the app was until they force-close and reopen
    // it themselves. Recover automatically instead, on whichever signal the
    // browser actually gives:
    //   - webglcontextlost fires when it is detected directly.
    //   - pageshow with event.persisted fires when the browser restores the
    //     page from its back-forward cache (a frozen snapshot) instead of
    //     truly reloading it -- the likely cause here, since it skips
    //     Flutter's normal startup entirely and is common on mobile Safari.
    //   - visibilitychange is a last-resort catch-all for anything that
    //     slips past the first two, with a short hidden threshold since
    //     mobile OSes reclaim a backgrounded tab's resources quickly.
    (function () {
      var reloaded = false;
      function reloadOnce() {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      }
      document.addEventListener('webglcontextlost', reloadOnce, true);
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) reloadOnce();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          window.__eduvoraHiddenAt = Date.now();
        } else if (window.__eduvoraHiddenAt) {
          var hiddenMs = Date.now() - window.__eduvoraHiddenAt;
          if (hiddenMs > 20 * 1000) reloadOnce();
        }
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
