name: eduvora
description: "Eduvora - the learning companion for Nigerian university students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend: authentication, PostgreSQL data API and storage buckets.
  supabase_flutter: ^2.8.0

  # Local persistence for the session guard, onboarding profile and offline cache.
  shared_preferences: ^2.3.3

  # Material and note uploads.
  file_picker: ^8.1.4

  # Opening scholarship links and OAuth redirects.
  url_launcher: ^6.3.1

  # In-app lecture playback.
  video_player: ^2.9.2

  # British-English date and number formatting.
  intl: ^0.19.0

  # Stable identifiers for locally created records.
  uuid: ^4.5.1

  # Salted hashing for locally held credentials in Campus Mode.
  crypto: ^3.0.6

  # LaTeX rendering for maths, physics and engineering CBT questions.
  flutter_math_fork: ^0.7.4

  # Microphone recording for study-group voice notes.
  record: ^7.1.1

  # Voice-note and lecture-audio playback.
  just_audio: ^0.10.6

  # Emoji picker for the study-group composer.
  emoji_picker_flutter: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generates the launcher/home-screen icon from assets/branding for
  # Android, iOS and the web PWA — see flutter_launcher_icons.yaml.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
